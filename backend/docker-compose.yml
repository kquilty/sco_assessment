services:
  mysql:
    image: mysql:8.4
    container_name: starter-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: starter_db
      MYSQL_USER: starter
      MYSQL_PASSWORD: starter
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: